<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnowHubb.pl</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      background: #fbf7e8;
      color: #111;
    }

    /* NAV */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background: #f6f1df;
      border-bottom: 1px solid #e5dec8;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-weight: 600;
      margin: 0 15px;
    }

    /* HERO */
    .hero {
      background: url('background.jpg') center/cover no-repeat;
      padding: 120px 20px;
      text-align: center;
      position: relative;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.65);
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero img {
      max-width: 420px;
      width: 90%;
      margin-bottom: 30px;
    }

    .play-btn {
      display: inline-block;
      background: #ef4444;
      color: #fff;
      padding: 18px 36px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 0 #b91c1c;
    }

    .play-btn:hover {
      transform: translateY(2px);
      box-shadow: 0 4px 0 #b91c1c;
    }

    /* COMMUNITY */
    .community {
      padding: 80px 20px;
      text-align: center;
    }

    .community h2 {
      font-size: 2.5rem;
      margin-bottom: 50px;
      position: relative;
      display: inline-block;
    }

    .community h2::after {
      content: '';
      display: block;
      height: 6px;
      width: 100%;
      background: #ef4444;
      margin-top: 10px;
    }

    .boxes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
      max-width: 900px;
      margin: auto;
    }

    .box {
      background: #fff;
      border: 2px solid #111;
      border-radius: 14px;
      padding: 25px;
      font-weight: 600;
    }

    .players {
      font-size: 2.5rem;
      color: #22c55e;
      margin-top: 10px;
    }

    footer {
      padding: 30px;
      text-align: center;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <nav>
    <div>🛒 Sklep</div>
    <div><strong>SNOWHUBB</strong></div>
    <div>📜 Regulamin</div>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <img src="logo.png" alt="SnowHubb">
      <br>
      <a href="#" class="play-btn">▶ ZAGRAJ Z NAMI!</a>
    </div>
  </section>

  <section class="community">
    <h2>Dołącz do naszej społeczności!</h2>

    <div class="boxes">
      <div class="box">💬 Discord</div>
      <div class="box">📡 Liczba graczy:<div class="players">13</div></div>
      <div class="box">🎵 TikTok</div>
    </div>
  </section>

  <footer>
    © 2026 SnowHubb.pl
  </footer>

</body>
</html>
